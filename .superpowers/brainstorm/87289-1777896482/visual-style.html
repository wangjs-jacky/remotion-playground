<h2>选择视觉风格方向</h2>
<p class="subtitle">程序化动画无法模拟真实食物照片，但可以用风格化设计传达同样的广告感</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>Terminal Noir 暗黑美食</h3>
      <p>你偏好的深色主题 + 霓虹点缀。暗色石质背景，食材用发光轮廓线+半透明渐变表现，蒸汽用粒子动画。类似赛博朋克美食广告。</p>
      <div style="margin-top:12px;display:flex;gap:8px;">
        <div style="width:40px;height:40px;border-radius:8px;background:#0a0a0b;border:1px solid rgba(255,255,255,0.1)"></div>
        <div style="width:40px;height:40px;border-radius:8px;background:#00ff88"></div>
        <div style="width:40px;height:40px;border-radius:8px;background:#ffb800"></div>
        <div style="width:40px;height:40px;border-radius:8px;background:#ff4757"></div>
      </div>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>暖光摄影棚模拟</h3>
      <p>模拟原文的高端食品广告暖光风格。暖色渐变背景，食材用圆形+渐变色块表示，蒸汽用半透明白色粒子。偏写实配色，偏抽象形状。</p>
      <div style="margin-top:12px;display:flex;gap:8px;">
        <div style="width:40px;height:40px;border-radius:8px;background:#1a1412;border:1px solid rgba(255,255,255,0.1)"></div>
        <div style="width:40px;height:40px;border-radius:8px;background:#d4a574"></div>
        <div style="width:40px;height:40px;border-radius:8px;background:#e8854a"></div>
        <div style="width:40px;height:40px;border-radius:8px;background:#8b5e3c"></div>
      </div>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>扁平插画风</h3>
      <p>简洁的几何形状 + 大色块插画风格。食材用扁平化图标表达，镜头运动流畅，转场干净利落。类似高端 motion graphics 广告。</p>
      <div style="margin-top:12px;display:flex;gap:8px;">
        <div style="width:40px;height:40px;border-radius:8px;background:#1c1c1e;border:1px solid rgba(255,255,255,0.1)"></div>
        <div style="width:40px;height:40px;border-radius:8px;background:#ff6b35"></div>
        <div style="width:40px;height:40px;border-radius:8px;background:#ffd166"></div>
        <div style="width:40px;height:40px;border-radius:8px;background:#06d6a0"></div>
      </div>
    </div>
  </div>
</div>
